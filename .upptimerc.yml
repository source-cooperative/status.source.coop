# External monitoring and public status page for Source Cooperative.
# Checks run from GitHub Actions every 5 minutes, outside Cloudflare, Vercel and
# AWS, so they still work when any of those is down. Downtime opens an issue
# here and notifies Slack; recovery closes it and notifies again.
# Why this exists: data.source.coop ADR-015, M4.
owner: source-cooperative
repo: status.source.coop
user-agent: source-cooperative-status

# Only these secrets may be substituted into the config. GH_PAT is passed to the
# workflows separately and is not listed.
secrets:
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL

sites:
  - name: Website
    url: https://source.coop/
    maxResponseTime: 5000

  # The data proxy Worker answers this itself, with no upstream calls: it fails
  # only when Cloudflare or the Worker does.
  - name: Data proxy
    url: https://data.source.coop/
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "Source Cooperative Data Proxy"

  # A real read through the proxy: Source API lookup, AWS credentials, S3.
  - name: Data reads
    url: https://data.source.coop/radiantearth/landcovernet/README.md
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "LandCoverNet"

  # What S3 clients and the CLI discover before exchanging credentials at /.sts.
  - name: Credential exchange
    url: https://data.source.coop/.well-known/openid-configuration
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"issuer"'

  - name: Sign-in
    url: https://auth.source.coop/.well-known/openid-configuration
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"issuer"'

# Styled from ops-source brand/brand.json. Files in assets/ are copied to the
# site root at build time, so /theme.css, /brand.css and the icons are served
# from status.source.coop itself.
status-website:
  cname: status.source.coop
  logoUrl: /logomark.svg
  logoHref: https://source.coop
  favicon: /favicon.ico
  name: Source Cooperative Status
  # Replaces Upptime's light/dark themes: Source's identity is light (Ink on Bone).
  themeUrl: /theme.css
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap
    - rel: stylesheet
      href: /brand.css
    - rel: apple-touch-icon
      href: /apple-touch-icon.png
  metaTags:
    - name: theme-color
      content: "#EFEBEA"
    - name: color-scheme
      content: light
    - name: og:image
      content: https://status.source.coop/og.png
  introTitle: "**Source Cooperative** service status"
  introMessage: Live availability of source.coop and its data service, checked every 5 minutes from outside our infrastructure.
  navbar:
    - title: Status
      href: /
    - title: Source Cooperative
      href: https://source.coop
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
